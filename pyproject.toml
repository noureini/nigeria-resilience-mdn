[project]
name = "nigeria-resilience"
version = "1.0.0"
description = "Replication package for 'Predicting Poverty-Resilient Households using Machine Learning in Sub-Saharan Africa' (Oxford Bulletin of Economics and Statistics)."
readme = "README.md"
requires-python = "==3.9.*"
license = { text = "MIT" }
authors = [
    { name = "Nouréini Souleymane Sayouti", email = "nsayouti@poverty-action.org" },
    { name = "Edouard Romeo Mensah", email = "mensahedouard@gmail.com" },
]
# Versions are pinned exactly to the environment that produced the published
# results (Python 3.9, TensorFlow 2.8).  uv.lock pins the full dependency graph.
dependencies = [
    "numpy==1.22.4",
    "pandas==1.5.3",
    "scipy==1.10.1",
    "statsmodels==0.13.5",
    "scikit-learn==1.3.2",
    "tensorflow==2.8.0",
    "tensorflow-probability==0.15.0",
    "keras==2.8.0",
    "protobuf==3.19.6",
    # TF 2.8 only needs >=0.23.1; the newest releases ship no Windows wheels.
    "tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'",
    "xgboost==2.1.4",
    "torch==2.2.2",            # used by the vendored xgboostlss (CPU build)
    "pyro-ppl==1.9.1",         # used by the vendored xgboostlss
    "shap==0.48.0",            # imported by the vendored xgboostlss
    "optuna==4.3.0",
    "matplotlib==3.5.1",
    "seaborn==0.13.2",
    "tqdm>=4.64,<5",
    "openpyxl==3.1.5",
    "pyarrow==21.0.0",
    "climate-indices==2.0.1",  # SPI in the data stage
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nigeria_resilience", "src/xgboostlss"]

[tool.uv]
# greenlet >= 3.2.5 ships no Windows wheel for Python 3.9.
constraint-dependencies = ["greenlet<3.2.5"]
# TensorFlow 2.8 publishes wheels for Linux x86_64 and Windows x86_64 (and
# Intel macOS).  Apple-silicon users should use the Docker image.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
